name: ci

on:
  push:
  pull_request:

jobs:
  web:
    name: TypeScript, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm --filter web lint
      - name: Format
        run: pnpm format:check
      - name: Tests with coverage
        run: pnpm test:cov
      - name: Production build
        run: pnpm build

  python:
    name: Python, parser and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Tesseract for the OCR tests
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests with coverage
        run: uv run pytest -q

  security:
    name: Dependency audit, secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: npm advisories
        run: pnpm audit
      - name: Python advisories
        run: |
          uv export --frozen --no-emit-workspace --all-packages --all-groups > requirements-audit.txt
          uvx pip-audit --disable-pip -r requirements-audit.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: API and web answer
        run: |
          curl --fail --silent http://localhost:8121/health
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent --output /dev/null http://localhost:3000/section
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down
