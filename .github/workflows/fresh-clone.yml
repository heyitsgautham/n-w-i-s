name: fresh clone

# Rebuilds the demo pack from nothing, the way a new contributor's `make setup && make data` does,
# then checks the generator and renderer reproduced the committed files and runs every test on the result.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"
  pull_request:
    paths:
      - "packages/synth/**"
      - "packages/extract/**"
      - "Makefile"

jobs:
  bootstrap:
    name: Setup, build the pack, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The parser runs eight Tesseract processes at once. Each one spinning up its own OpenMP threads on a
      # four-core runner left the first run still OCRing after 15 minutes.
      OMP_THREAD_LIMIT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - name: Tesseract for the OCR pass
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Remove the committed pack
        run: rm -rf data/demo/field.json data/demo/reports.json data/demo/ddr data/demo/extracted
      - name: Setup
        run: make setup
      - name: Build the demo pack
        run: make data
      - name: Parser found the planted incidents
        # Tesseract builds read the scanned pages a little differently: Ubuntu's finds all 120 planted incidents,
        # the macOS build behind the committed pack finds 118. So the floor is checked here, not exact counts.
        run: |
          uv run python - <<'PY'
          import json
          stats = json.load(open("data/demo/extracted/stats.json"))
          acc = stats["accuracy"]
          print(f"{stats['documents']} reports, {stats['ocrPages']} OCR pages, found {acc['found']} of {acc['truthEvents']}")
          assert stats["documents"] == 926 and stats["ocrPages"] == 190
          assert acc["found"] >= 118 and acc["kindRight"] == acc["depthExact"] == acc["found"]
          PY
      - name: Restore the committed pack
        # The tests pin the committed pack's exact counts, so they run against it.
        run: git checkout -- data/demo
      - name: Test
        run: pnpm test
