[project]
name = "wells-api"
version = "0.2.0"
description = "API: wells, events, replay, search, document pages, review queue, briefing export"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.29",
    "pypdfium2>=4",
    "reportlab>=4",
    "prometheus-client>=0.26",
    "sentry-sdk>=2.73",
    "wells-extract",
]

[tool.uv.sources]
wells-extract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
